name: FizzBuzz CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fizzbuzz:
    name: FizzBuzz tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run FizzBuzz unit and acceptance tests
        run: mvn --batch-mode --no-transfer-progress '-Dtest=FizzBuzzTest,FizzBuzzAcceptanceTest' test

      - name: Save FizzBuzz test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fizzbuzz-test-reports
          path: |
            target/surefire-reports/
            target/cucumber/
          retention-days: 14
